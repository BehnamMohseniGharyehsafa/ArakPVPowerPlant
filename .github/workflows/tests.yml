name: Scientific and interface checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock --no-deps --disable-pip
      - run: python scripts/build_reference.py
      - run: pytest -q
      - run: npm ci && npm audit --audit-level=moderate && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/solar-api.log 2>&1 &
      - run: npm run test:e2e
        working-directory: frontend
      - name: Verify the actual production container serves its frontend
        run: |
          docker build -t solar-twin .
          docker run -d --name solar-smoke -p 127.0.0.1:8001:8000 -e PORT=8000 -e SOLAR_PUBLIC=1 solar-twin
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8001/ | grep 'id="root"'
          curl --fail --silent http://127.0.0.1:8001/report-actions.js
          docker logs solar-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
