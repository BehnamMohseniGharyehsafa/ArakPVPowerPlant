services:
  solar-field:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - solar-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  solar-data:
